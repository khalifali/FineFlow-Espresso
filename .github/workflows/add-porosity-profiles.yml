name: Add axial porosity profiles

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-porosity-profiles.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LaTeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-pictures \
            texlive-fonts-recommended lmodern poppler-utils

      - name: Prepare Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r fineflow_espresso_solver/fineflow_espresso/requirements.txt
          .venv/bin/python -m pip install pymupdf

      - name: Add porosity output and results slide
        run: .venv/bin/python tools/update_porosity_profiles.py

      - name: Run unit tests
        run: .venv/bin/python -m unittest discover -s fineflow_espresso_solver/fineflow_espresso -p test_fineflow.py

      - name: Regenerate fine-puck porosity profiles
        run: |
          rm -rf _porosity_build
          .venv/bin/python fineflow_espresso_solver/fineflow_espresso/fineflow_espresso.py \
            --config fineflow_espresso_solver/fineflow_espresso/case_config.json \
            --output-dir _porosity_build
          cp _porosity_build/fine_puck_porosity_profiles.png fineflow_espresso_solver/fineflow_espresso/results/
          cp _porosity_build/fine_puck_porosity_profiles.pdf fineflow_espresso_solver/fineflow_espresso/results/
          cp _porosity_build/fine_puck_porosity_profiles.png fineflow_espresso_sectioned_source/figures/porosity_profiles.png
          cp _porosity_build/fine_puck_porosity_profiles.pdf fineflow_espresso_sectioned_source/figures/porosity_profiles.pdf

      - name: Compile sectioned Beamer deck and presenter transcript
        run: |
          cd fineflow_espresso_sectioned_source
          pdflatex -interaction=nonstopmode -halt-on-error fineflow_espresso_sectioned.tex
          pdflatex -interaction=nonstopmode -halt-on-error fineflow_espresso_sectioned.tex
          ../.venv/bin/python build_transcript.py
          test "$(pdfinfo fineflow_espresso_sectioned.pdf | awk '/^Pages:/ {print $2}')" = "49"

      - name: Commit generated curve and revised presentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            fineflow_espresso_solver/fineflow_espresso/fineflow_espresso.py \
            fineflow_espresso_solver/fineflow_espresso/test_fineflow.py \
            fineflow_espresso_solver/fineflow_espresso/results/fine_puck_porosity_profiles.png \
            fineflow_espresso_solver/fineflow_espresso/results/fine_puck_porosity_profiles.pdf \
            fineflow_espresso_sectioned_source/fineflow_espresso_sectioned.tex \
            fineflow_espresso_sectioned_source/fineflow_espresso_sectioned.pdf \
            fineflow_espresso_sectioned_source/fineflow_espresso_sectioned_with_transcript.pdf \
            fineflow_espresso_sectioned_source/figures/porosity_profiles.png \
            fineflow_espresso_sectioned_source/figures/porosity_profiles.pdf \
            fineflow_espresso_sectioned_source/slide_map.json \
            fineflow_espresso_sectioned_source/transcript.json \
            fineflow_espresso_sectioned_source/README_BUILD.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add axial porosity evolution to results"
            git push origin HEAD:main
          fi
