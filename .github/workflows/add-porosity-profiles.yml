name: Add axial porosity profiles

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-porosity-profiles.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r fineflow_espresso_solver/fineflow_espresso/requirements.txt
          .venv/bin/python -m pip install pymupdf

      - name: Add porosity publication figure and presentation slide
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import json

          solver = Path('fineflow_espresso_solver/fineflow_espresso/fineflow_espresso.py')
          text = solver.read_text(encoding='utf-8')
          marker = '    _save_publication_figure(fig, output_dir / f"{prefix}_relative_permeability")\n'
          if 'f"{prefix}_porosity_profiles"' not in text:
              if marker not in text:
                  raise SystemExit('Could not locate publication-figure insertion point')
              addition = r'''

    # Axial porosity profiles at representative extraction times.  These are
    # the same 1D observable that can be compared with interrupted CT profiles.
    target_times_s = (0.0, min(10.0, time[-1]), min(30.0, time[-1]), time[-1])
    profile_indices = []
    for target_time in target_times_s:
        index = int(np.argmin(np.abs(time - target_time)))
        if index not in profile_indices:
            profile_indices.append(index)

    fig, ax = plt.subplots(figsize=(6.4, 4.2), constrained_layout=True)
    colors = ("#9A9A9A", "#66B5D8", "#005293", "#6F4E37")
    for color, index in zip(colors, profile_indices):
        ax.plot(
            z_mm,
            result.porosity[index],
            color=color,
            lw=2.1,
            label=f"{time[index]:g} s",
        )
    selected_porosity = result.porosity[profile_indices]
    ymin = float(np.min(selected_porosity))
    ymax = float(np.max(selected_porosity))
    margin = max(0.0015, 0.08 * max(ymax - ymin, 1.0e-6))
    ax.set_ylim(max(0.0, ymin - margin), min(1.0, ymax + margin))
    ax.set_xlabel("Depth from inlet / top of puck [mm]")
    ax.set_ylabel("Porosity [-]")
    ax.grid(alpha=0.22)
    ax.legend(title="Extraction time", loc="best", frameon=False)
    _save_publication_figure(fig, output_dir / f"{prefix}_porosity_profiles")
'''
              text = text.replace(marker, marker + addition, 1)
              solver.write_text(text, encoding='utf-8')

          test_file = Path('fineflow_espresso_solver/fineflow_espresso/test_fineflow.py')
          test_text = test_file.read_text(encoding='utf-8')
          test_marker = '            self.assertIn("named_test_relative_permeability.png", names)\n'
          if 'named_test_porosity_profiles.png' not in test_text:
              if test_marker not in test_text:
                  raise SystemExit('Could not locate publication-output test insertion point')
              test_text = test_text.replace(
                  test_marker,
                  test_marker
                  + '            self.assertIn("named_test_porosity_profiles.png", names)\n'
                  + '            self.assertIn("named_test_porosity_profiles.pdf", names)\n',
                  1,
              )
              test_file.write_text(test_text, encoding='utf-8')

          tex_path = Path('fineflow_espresso_sectioned_source/fineflow_espresso_sectioned.tex')
          tex = tex_path.read_text(encoding='utf-8')
          slide_title = 'Porosity profile evolves as fines redistribute'
          slide_anchor = r'\begin{frame}{Fine puck: constant pressure versus PI}'
          if slide_title not in tex:
              if slide_anchor not in tex:
                  raise SystemExit('Could not locate slide insertion point')
              slide = r'''
\begin{frame}{Porosity profile evolves as fines redistribute}
{\small\color{tumblue}Constant 9 bar across puck + basket. Exponential permeability. Illustrative, uncalibrated case.}\par\medskip
\begin{columns}[T,onlytextwidth]
 \column{.66\textwidth}\centering
  \safeimage{porosity_profiles.pdf}{\linewidth}{4.05cm}
 \column{.30\textwidth}\small
  \hi{Predicted structure}
  \begin{itemize}
   \item Direct model observable: $\varepsilon(z,t)$.
   \item Initial profile: $\varepsilon_0=0.36$.
   \item Deposition lowers porosity, most strongly near the outlet/bottom.
   \item At 60 s: $\varepsilon\approx0.338$--$0.355$.
  \end{itemize}
\end{columns}
\vspace{.08cm}
\takeaway{The predicted axial porosity evolution can be compared directly with interrupted CT profiles at matched extraction times.}
\slidesource{Model $t=0$ is the start of extraction in the saturated 1D model; dry and preinfusion stages are not represented separately.}
\end{frame}

'''
              tex = tex.replace(slide_anchor, slide + slide_anchor, 1)
              tex_path.write_text(tex, encoding='utf-8')

          slide_map_path = Path('fineflow_espresso_sectioned_source/slide_map.json')
          slide_map = json.loads(slide_map_path.read_text(encoding='utf-8'))
          if not any(item.get('title') == slide_title for item in slide_map):
              for item in slide_map:
                  if int(item['slide']) >= 36:
                      item['slide'] = int(item['slide']) + 1
              insert_at = next(i for i, item in enumerate(slide_map) if int(item['slide']) == 35) + 1
              slide_map.insert(insert_at, {
                  'slide': 36,
                  'section': 'Illustrative results and model sensitivity',
                  'title': slide_title,
              })
              slide_map_path.write_text(json.dumps(slide_map, indent=2) + '\n', encoding='utf-8')

          transcript_path = Path('fineflow_espresso_sectioned_source/transcript.json')
          transcript = json.loads(transcript_path.read_text(encoding='utf-8'))
          if '36' not in transcript or 'axial porosity history' not in transcript.get('36', ''):
              shifted = {}
              for key, value in transcript.items():
                  number = int(key)
                  shifted[str(number + 1 if number >= 36 else number)] = value
              shifted['36'] = (
                  'This plot uses the axial porosity history already returned by the solver. '
                  'The initial illustrative bed is uniform at epsilon 0.36. As fines are released, '
                  'transported and recaptured, deposition lowers porosity throughout the puck, with '
                  'the strongest decrease near the outlet because the current capture closure is weighted there. '
                  'At sixty seconds the profile spans about 0.338 to 0.355. This is not a dry-to-wet comparison: '
                  'model time zero is the start of full extraction in an already saturated one-dimensional bed. '
                  'The direct validation target is therefore the CT porosity profile at matched extraction times.'
              )
              ordered = {str(i): shifted[str(i)] for i in range(1, max(map(int, shifted)) + 1)}
              transcript_path.write_text(json.dumps(ordered, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          readme = Path('fineflow_espresso_sectioned_source/README_BUILD.txt')
          readme_text = readme.read_text(encoding='utf-8')
          readme_text = readme_text.replace('48 slides with seven section dividers', '49 slides with seven section dividers')
          if 'porosity profile' not in readme_text.lower():
              readme_text += '\nThe results section includes an axial porosity-profile figure generated from the saved solver porosity history.\n'
          readme.write_text(readme_text, encoding='utf-8')
          PY

      - name: Run unit tests
        run: .venv/bin/python -m unittest discover -s fineflow_espresso_solver/fineflow_espresso -p test_fineflow.py

      - name: Regenerate fine-puck porosity profiles
        run: |
          rm -rf _porosity_build
          .venv/bin/python fineflow_espresso_solver/fineflow_espresso/fineflow_espresso.py \
            --config fineflow_espresso_solver/fineflow_espresso/case_config.json \
            --output-dir _porosity_build
          cp _porosity_build/fine_puck_porosity_profiles.png fineflow_espresso_solver/fineflow_espresso/results/
          cp _porosity_build/fine_puck_porosity_profiles.pdf fineflow_espresso_solver/fineflow_espresso/results/
          cp _porosity_build/fine_puck_porosity_profiles.png fineflow_espresso_sectioned_source/figures/porosity_profiles.png
          cp _porosity_build/fine_puck_porosity_profiles.pdf fineflow_espresso_sectioned_source/figures/porosity_profiles.pdf

      - name: Compile sectioned Beamer deck and presenter transcript
        run: |
          cd fineflow_espresso_sectioned_source
          pdflatex -interaction=nonstopmode -halt-on-error fineflow_espresso_sectioned.tex
          pdflatex -interaction=nonstopmode -halt-on-error fineflow_espresso_sectioned.tex
          ../.venv/bin/python build_transcript.py
          test "$(pdfinfo fineflow_espresso_sectioned.pdf | awk '/^Pages:/ {print $2}')" = "49"

      - name: Commit generated curve and revised presentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            fineflow_espresso_solver/fineflow_espresso/fineflow_espresso.py \
            fineflow_espresso_solver/fineflow_espresso/test_fineflow.py \
            fineflow_espresso_solver/fineflow_espresso/results/fine_puck_porosity_profiles.png \
            fineflow_espresso_solver/fineflow_espresso/results/fine_puck_porosity_profiles.pdf \
            fineflow_espresso_sectioned_source/fineflow_espresso_sectioned.tex \
            fineflow_espresso_sectioned_source/fineflow_espresso_sectioned.pdf \
            fineflow_espresso_sectioned_source/fineflow_espresso_sectioned_with_transcript.pdf \
            fineflow_espresso_sectioned_source/figures/porosity_profiles.png \
            fineflow_espresso_sectioned_source/figures/porosity_profiles.pdf \
            fineflow_espresso_sectioned_source/slide_map.json \
            fineflow_espresso_sectioned_source/transcript.json \
            fineflow_espresso_sectioned_source/README_BUILD.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add axial porosity evolution to results"
            git push origin HEAD:main
          fi
