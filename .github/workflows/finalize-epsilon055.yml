name: Finalize epsilon 0.55 baseline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-epsilon055.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-pictures \
            texlive-fonts-recommended lmodern poppler-utils
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r fineflow_espresso_solver/fineflow_espresso/requirements.txt
          .venv/bin/python -m pip install pymupdf

      - name: Prepare baseline and documentation
        run: .venv/bin/python tools/finalize_epsilon055.py prepare

      - name: Run unit tests
        run: .venv/bin/python -m unittest discover -s fineflow_espresso_solver/fineflow_espresso -p test_fineflow.py

      - name: Regenerate baseline and comparisons
        run: |
          rm -rf _baseline055
          .venv/bin/python fineflow_espresso_solver/fineflow_espresso/fineflow_espresso.py \
            --config fineflow_espresso_solver/fineflow_espresso/case_config.json \
            --output-dir _baseline055
          cp _baseline055/fine_puck_* fineflow_espresso_solver/fineflow_espresso/results/
          .venv/bin/python fineflow_espresso_solver/fineflow_espresso/compare_pressure_modes.py
          .venv/bin/python fineflow_espresso_solver/fineflow_espresso/compare_closures.py

      - name: Fix TeX replacement helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/finalize_epsilon055.py')
          text = path.read_text(encoding='utf-8')
          if 'def sub(pattern, replacement, string, count=0):' not in text:
              text = text.replace(
                  'def sync_after_runs():\n',
                  'def sync_after_runs():\n    def sub(pattern, replacement, string, count=0):\n        return re.sub(pattern, lambda _match: replacement, string, count=count)\n'
              )
              text = text.replace('tex=re.sub(', 'tex=sub(')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Synchronize results with slides
        run: .venv/bin/python tools/finalize_epsilon055.py sync

      - name: Compile deck and transcript
        run: |
          cd fineflow_espresso_sectioned_source
          pdflatex -interaction=nonstopmode -halt-on-error fineflow_espresso_sectioned.tex
          pdflatex -interaction=nonstopmode -halt-on-error fineflow_espresso_sectioned.tex
          ../.venv/bin/python build_transcript.py
          pdftoppm -f 36 -singlefile -png -r 180 fineflow_espresso_sectioned.pdf porosity_slide36

      - name: Commit final synchronized state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/finalize_epsilon055.py \
            fineflow_espresso_solver/fineflow_espresso/fineflow_espresso.py \
            fineflow_espresso_solver/fineflow_espresso/case_config.json \
            fineflow_espresso_solver/fineflow_espresso/comparison_reference.json \
            fineflow_espresso_solver/fineflow_espresso/README.md \
            fineflow_espresso_solver/fineflow_espresso/RUNNING_THE_SOLVER.txt \
            fineflow_espresso_solver/fineflow_espresso/PARAMETER_CALIBRATION_MATRIX.md \
            fineflow_espresso_solver/fineflow_espresso/results \
            fineflow_espresso_solver/fineflow_espresso/pressure_comparison \
            fineflow_espresso_solver/fineflow_espresso/closure_comparison \
            fineflow_espresso_sectioned_source/figures \
            fineflow_espresso_sectioned_source/fineflow_espresso_sectioned.tex \
            fineflow_espresso_sectioned_source/fineflow_espresso_sectioned.pdf \
            fineflow_espresso_sectioned_source/fineflow_espresso_sectioned_with_transcript.pdf \
            fineflow_espresso_sectioned_source/transcript.json \
            fineflow_espresso_sectioned_source/README_BUILD.txt
          if ! git diff --cached --quiet; then
            git commit -m "Adopt epsilon 0.55 baseline and map calibration sources"
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: epsilon055-results-preview
          path: |
            fineflow_espresso_solver/fineflow_espresso/results/fine_puck_porosity_profiles.png
            fineflow_espresso_sectioned_source/porosity_slide36.png
