name: Fix porosity slide layout
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-slide36-layout.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-pictures texlive-fonts-recommended lmodern poppler-utils
          python3 -m pip install pymupdf
      - name: Remove overlapping source note
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fineflow_espresso_sectioned_source/fineflow_espresso_sectioned.tex')
          t=p.read_text()
          line='\\slidesource{Illustrative 1D result; the GL22, GL25 and GL28 dry CT profiles have similar mean porosity but different local structure.}\n'
          t=t.replace(line,'')
          p.write_text(t)
          PY
      - name: Compile and preview
        run: |
          cd fineflow_espresso_sectioned_source
          pdflatex -interaction=nonstopmode -halt-on-error fineflow_espresso_sectioned.tex
          pdflatex -interaction=nonstopmode -halt-on-error fineflow_espresso_sectioned.tex
          python3 build_transcript.py
          pdftoppm -f 36 -singlefile -png -r 180 fineflow_espresso_sectioned.pdf porosity_slide36
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fineflow_espresso_sectioned_source/fineflow_espresso_sectioned.tex fineflow_espresso_sectioned_source/fineflow_espresso_sectioned.pdf fineflow_espresso_sectioned_source/fineflow_espresso_sectioned_with_transcript.pdf
          git commit -m "Fix porosity slide footer spacing"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: porosity-slide36-final
          path: fineflow_espresso_sectioned_source/porosity_slide36.png
